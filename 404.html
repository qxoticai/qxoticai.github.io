<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Quixotic AI</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#f4ead8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1e1915" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500..800&family=Funnel+Sans:wght@400..600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: light dark;
            --paper:  light-dark(#f4ead8, #1e1915);
            --ink:    light-dark(#2a221c, #efe4d2);
            --muted:  light-dark(#6e6153, #a89a87);
            --line:   light-dark(#d2c2a6, #4a3d33);
            --accent: light-dark(#a13f2e, #d1563d);
            --button: light-dark(#a13f2e, #86362a);   /* the site's --band: white text stays above 4.5:1 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Funnel Sans', 'Helvetica Neue', Arial, sans-serif;
            background: var(--paper);
            color: var(--muted);
        }
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 1rem;
            padding: 1.5rem;
        }
        img { width: 72px; height: 72px; margin-bottom: .5rem; }
        h1 {
            font: 800 clamp(4rem, 14vw, 7rem)/1 'Funnel Display', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: -0.05em;
            color: var(--ink);
        }
        h1 span { color: var(--accent); }
        p { font-size: 1.125rem; }
        .home {
            display: inline-flex; align-items: center; height: 44px; margin-top: 1rem; padding: 0 1.25rem;
            border-radius: 8px; background: var(--button); color: #fff; font-weight: 600; text-decoration: none;
            box-shadow: 0 1px 2px rgba(40, 20, 12, .12), 0 6px 14px -8px rgba(40, 20, 12, .32);
            transition: transform .2s, box-shadow .25s;
        }
        .home:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(40, 20, 12, .12), 0 12px 22px -12px rgba(40, 20, 12, .4); }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.4rem; margin-top: .75rem; font-size: .9375rem; }
        nav a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: color .2s, text-decoration-color .2s; }
        nav a:hover { color: var(--ink); text-decoration-color: var(--accent); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>
<body>
<main>
    <img src="/logo.svg" alt="">
    <h1>4<span>0</span>4</h1>
    <p>No windmills here.</p>
    <a class="home" href="/">&larr; Back to qxotic.ai</a>
    <nav aria-label="Popular pages">
        <a href="/#capabilities">Demos</a>
        <a href="/#benchmarks">Benchmarks</a>
        <a href="/#code">Examples</a>
        <a href="/#contact">Contact</a>
    </nav>
</main>
</body>
</html>
