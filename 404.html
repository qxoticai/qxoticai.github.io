        @font-face { font-family: 'Funnel Sans'; font-style: normal; font-weight: 400 600; font-display: swap; src: url('/fonts/funnel-sans-latin.woff2') format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
        :root {
            color-scheme: light dark;
            --paper:  light-dark(#f4ead8, #1e1915);
            --ink:    light-dark(#2a221c, #efe4d2);
            --muted:  light-dark(#6e6153, #a89a87);
            --line:   light-dark(#d2c2a6, #4a3d33);
            --accent: light-dark(#a13f2e, #d1563d);
            --button: light-dark(#a13f2e, #86362a);   /* the site's --band: white text stays above 4.5:1 */
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Funnel Sans', 'Helvetica Neue', Arial, sans-serif;
            background: var(--paper);
            color: var(--muted);
        }
        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 1rem;
            padding: 1.5rem;
        }
        img { width: 72px; height: 72px; margin-bottom: .5rem; }
        h1 {
            font: 800 clamp(4rem, 14vw, 7rem)/1 'Funnel Display', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: -0.05em;
            color: var(--ink);
        }
        h1 span { color: var(--accent); }
        p { font-size: 1.125rem; }
        .home {
            display: inline-flex; align-items: center; height: 44px; margin-top: 1rem; padding: 0 1.25rem;
            border-radius: 8px; background: var(--button); color: #fff; font-weight: 600; text-decoration: none;
            box-shadow: 0 1px 2px rgba(40, 20, 12, .12), 0 6px 14px -8px rgba(40, 20, 12, .32);
            transition: transform .2s, box-shadow .25s;
        }
        .home:hover { transform: translateY(-1px); box-shadow: 0 2px 4px rgba(40, 20, 12, .12), 0 12px 22px -12px rgba(40, 20, 12, .4); }
        nav { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1.4rem; margin-top: .75rem; font-size: .9375rem; }
        nav a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; transition: color .2s, text-decoration-color .2s; }
        nav a:hover { color: var(--ink); text-decoration-color: var(--accent); }
        a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
</head>

<main>
    <img src="/logo.svg" alt="">
    <h1>4<span>0</span>4</h1>
    <p>No windmills here.</p>
    <a class="home" href="/">&larr; Back to qxotic.ai</a>
    <nav aria-label="Popular pages">
